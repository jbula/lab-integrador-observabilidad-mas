# ════════════════════════════════════════════════════════════════════════════
# docker-compose.yaml — Stack completo de observabilidad OTel local
#
# Iniciar: docker compose up -d
# Verificar: docker compose ps
# Teardown:  docker compose down -v
#
# Accesos:
#   FastAPI service-a:   http://localhost:8000/docs
#   FastAPI service-b:   http://localhost:8001/docs
#   Jaeger UI:           http://localhost:16686
#   Grafana:             http://localhost:3000 (admin/admin)
#   Prometheus:          http://localhost:9091
#   OTel Collector zpages: http://localhost:55679
# ════════════════════════════════════════════════════════════════════════════

networks:
  otel-net:
    driver: bridge

volumes:
  postgres-a-data:
  postgres-b-data:
  postgres-d-data:
  prometheus-data:
  grafana-data:
  jaeger-data:
  loki-data:

services:
  # ── DB de service-a (orders) — base de datos por servicio ────────────────
  postgres-a:
    image: postgres:16-alpine
    container_name: postgres-a
    environment:
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       ordersdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
      - ./scripts/init-db-orders.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── DB de service-b (inventory) — base de datos por servicio ─────────────
  postgres-b:
    image: postgres:16-alpine
    container_name: postgres-b
    environment:
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       inventorydb
    ports:
      - "5433:5432"
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
      - ./scripts/init-db-inventory.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── OTel Collector ───────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: otel-collector
    command: ["--config=/etc/otel/collector-config.local.yaml"]
    volumes:
      - ./otel-collector/collector-config.local.yaml:/etc/otel/collector-config.local.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Métricas internas del Collector
      - "8889:8889"    # Prometheus endpoint (métricas de los servicios)
      - "13133:13133"  # Health check
      - "55679:55679"  # zPages (debug pipeline)
    environment:
      ENVIRONMENT: development
      CLOUD_REGION: us-central1
    networks:
      - otel-net
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Jaeger (backend de trazas) ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    user: "0"                          
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP legacy
      - "4317"         # OTLP gRPC interno — solo el Collector lo usa
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DB de data-service (analytics) — base de datos por servicio ──────────
  postgres-d:
    image: postgres:16-alpine
    container_name: postgres-d
    environment:
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       analyticsdb
    ports:
      - "5434:5432"
    volumes:
      - postgres-d-data:/var/lib/postgresql/data
      - ./scripts/init-db-analytics.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analyticsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── data-service (Lab 4, Modulo A) ───────────────────────────────────────
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: data-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL:                 postgresql://app:secret@postgres-d:5432/analyticsdb
      DB_HOST:                      postgres-d
      DB_NAME:                      analyticsdb
      ENVIRONMENT:                  development
      CLOUD_PROVIDER:               local
      OTEL_ENABLED:                 ${OTEL_ENABLED:-true}
      CHAOS_ERROR_RATE:             ${CHAOS_ERROR_RATE:-0}
      CHAOS_LATENCY_MS:             ${CHAOS_LATENCY_MS:-0}
    ports:
      - "8002:8002"
    networks:
      - otel-net
    depends_on:
      postgres-d:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  # ── Prometheus (backend de métricas) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # Prometheus UI (9091 para no colisionar con apps)
    networks:
      - otel-net
    depends_on:
      - otel-collector

  # ── Alertmanager (Modulo B) ──────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml"]
    volumes:
      - ./alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports:
      - "9093:9093"
    networks:
      - otel-net
    depends_on:
      - alert-enricher

  # ── alert-enricher: añade el trace_id a las alertas (Modulo B) ───────────
  alert-enricher:
    build:
      context: ./alert-enricher
      dockerfile: Dockerfile
    container_name: alert-enricher
    environment:
      LOKI_URL:       http://loki:3100
      JAEGER_UI_URL:  http://localhost:16686
    ports:
      - "9099:9099"
    networks:
      - otel-net
    depends_on:
      loki:
        condition: service_healthy

  # ── node-exporter: expone las metricas de CVE (textfile) y de red (Modulo C) ──
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
      - "--collector.netdev"
    volumes:
      - ./security/metrics:/textfile:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - otel-net

  # ── Grafana (visualización) ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - otel-net
    depends_on:
      - prometheus
      - jaeger


  # ── Loki (backend de logs, correlación por trace_id) ─────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Promtail (lee stdout de contenedores -> Loki) ────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - otel-net
    depends_on:
      - loki

  # ── service-a ────────────────────────────────────────────────────────────
  service-a:
    build:
      context: ./service-a
      dockerfile: Dockerfile
    container_name: service-a
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_B_URL:                http://service-b:8001
      DATABASE_URL:                 postgresql://app:secret@postgres-a:5432/ordersdb
      PROMETHEUS_PORT:              "9064"
      ENVIRONMENT:                  development
      CLOUD_PROVIDER:               local
      OTEL_ENABLED:                 ${OTEL_ENABLED:-true}
    ports:
      - "8000:8000"   # FastAPI
      - "9064:9064"   # Prometheus /metrics
    networks:
      - otel-net
    depends_on:
      postgres-a:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── service-b ────────────────────────────────────────────────────────────
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    container_name: service-b
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL:                 postgresql://app:secret@postgres-b:5432/inventorydb
      PROMETHEUS_PORT:              "9065"
      ENVIRONMENT:                  development
      CLOUD_PROVIDER:               local
      OTEL_ENABLED:                 ${OTEL_ENABLED:-true}
      SIMULATE_DB_LATENCY:          ${SIMULATE_DB_LATENCY:-true}
      DATA_SERVICE_URL:             http://data-service:8002
    ports:
      - "8001:8001"   # FastAPI
      - "9065:9065"   # Prometheus /metrics (mapeado a 9092 en host)
    networks:
      - otel-net
    depends_on:
      postgres-b:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
